name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      # The devkitPro image is minimal; make sure git and zip exist so the
      # libultrahand submodule can be fetched and the release can be packaged.
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git zip ca-certificates

      # Updates devkitA64/libnx to the newest release and installs the
      # portlibs current libultrahand links against (curl, zlib, minizip, mbedtls).
      - name: Update devkitPro and install libraries
        run: |
          dkp-pacman -Syu --noconfirm --needed \
            switch-curl switch-zlib switch-minizip switch-mbedtls

      # Builds the exact libultrahand commit pinned in this repo.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show versions being built
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "libultrahand:"
          git -C libs/libultrahand log -1 --oneline
          echo "compiler:"
          aarch64-none-elf-g++ --version | head -1

      - name: Build with Makefile
        run: |
          make clean || true
          make -j"$(nproc)"

      - name: Package release
        id: package
        run: |
          set -e
          OVL="$(ls ./*.ovl | head -n 1)"
          NAME="$(basename "$OVL" .ovl)"
          echo "Built: $OVL"

          # Layout matches the SD card: sdmc:/switch/.overlays/<name>.ovl
          mkdir -p dist/switch/.overlays
          cp "$OVL" dist/switch/.overlays/

          (cd dist && zip -r "../${NAME}.zip" switch)

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.name }}.zip
