name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      # The devkitPro image is minimal; make sure git and zip exist so the
      # libultrahand submodule can be fetched and the release can be packaged.
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git zip ca-certificates

      # Current libultrahand links against curl, zlib and mbedtls from devkitPro.
      # Checks what the image already has (no network needed) and only goes
      # to pkg.devkitpro.org for packages that are missing, with retries.
      - name: Ensure devkitPro libraries
        run: |
          PKGS="switch-curl switch-zlib switch-mbedtls"

          echo "Status of required packages in the image:"
          for p in $PKGS; do
            if dkp-pacman -Q "$p" 2>/dev/null; then :; else echo "$p: MISSING"; fi
          done

          MISSING=""
          for p in $PKGS; do
            dkp-pacman -Q "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"
          done

          if [ -z "$MISSING" ]; then
            echo "All required libraries already present; skipping network install."
            exit 0
          fi

          echo "Installing:$MISSING"
          for i in 1 2 3 4 5; do
            if dkp-pacman -Sy --noconfirm --needed $MISSING; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

          echo "::error::Could not install:$MISSING (pkg.devkitpro.org refused or was unreachable from this runner)"
          exit 1

      # devkitPro does not publish a switch-minizip package, but libultrahand's
      # download_funcs.hpp includes <minizip/unzip.h>. This builds the classic
      # minizip that ships inside zlib's source tree and installs it next to the
      # other Switch portlibs.
      - name: Build minizip for Switch
        run: |
          set -e
          PREFIX="$DEVKITPRO/portlibs/switch"

          if [ -f "$PREFIX/lib/libminizip.a" ] && [ -f "$PREFIX/include/minizip/unzip.h" ]; then
            echo "minizip already present; skipping."
            exit 0
          fi

          WORK="$(mktemp -d)"
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git "$WORK/zlib"
          SRC="$WORK/zlib/contrib/minizip"

          for f in ioapi unzip; do
            aarch64-none-elf-gcc -c -O2 -ffunction-sections -fdata-sections \
              -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE \
              -D__SWITCH__ -DUSE_FILE32API \
              -I"$PREFIX/include" \
              "$SRC/$f.c" -o "$WORK/$f.o"
          done

          mkdir -p "$PREFIX/lib" "$PREFIX/include/minizip"
          aarch64-none-elf-ar rcs "$PREFIX/lib/libminizip.a" "$WORK/ioapi.o" "$WORK/unzip.o"
          cp "$SRC/ioapi.h" "$SRC/unzip.h" "$SRC/crypt.h" "$PREFIX/include/minizip/"

          echo "Installed:"
          ls -l "$PREFIX/lib/libminizip.a" "$PREFIX/include/minizip/"

      # Builds the exact libultrahand commit pinned in this repo.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show versions being built
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "libultrahand:"
          git -C libs/libultrahand log -1 --oneline
          echo "compiler:"
          aarch64-none-elf-g++ --version | head -1

      - name: Build with Makefile
        run: |
          make clean || true
          make -j"$(nproc)"

      - name: Package release
        id: package
        run: |
          set -e
          OVL="$(ls ./*.ovl | head -n 1)"
          NAME="$(basename "$OVL" .ovl)"
          echo "Built: $OVL"

          # Layout matches the SD card: sdmc:/switch/.overlays/<name>.ovl
          mkdir -p dist/switch/.overlays
          cp "$OVL" dist/switch/.overlays/

          (cd dist && zip -r "../${NAME}.zip" switch)

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.name }}.zip
